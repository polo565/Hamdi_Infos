<style>
  :root {
    --bg:#e6ebf3; --surface:#ffffff; --text:#1a2330; --muted:#5b6676;
    --primary:#0f766e; --primary-dark:#0b5952; --accent:#f59e0b; --accent-dark:#c9810a;
    --border:#dbe2ee; --ring:rgba(15,118,110,.18); --radius:16px;
    --shadow:0 6px 22px rgba(20,40,70,.08); --shadow-lg:0 14px 36px rgba(20,40,70,.16); --max:1040px;
  }
  :root[data-theme="dark"]{
    --bg:#2b3142; --surface:#353d52; --text:#eef2f8; --muted:#aab4c5;
    --border:#454e66; --ring:rgba(96,165,250,.3);
    --shadow:0 8px 24px rgba(0,0,0,.4); --shadow-lg:0 16px 40px rgba(0,0,0,.55);
  }
  html{transition:background .2s;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:"Segoe UI",Tahoma,system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;}
  a{color:var(--primary);}
  .wrap{max-width:var(--max);margin:0 auto;padding:0 16px;}

  /* Header */
  .site-header{background:linear-gradient(135deg,var(--primary) 0%,#115e59 55%,#134e4a 100%);color:#fff;padding:24px 0 20px;}
  .site-header .wrap{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;}
  .brand h1{margin:0;font-size:1.5rem;}
  .brand p{margin:4px 0 0;opacity:.9;font-size:.92rem;max-width:640px;}
  .header-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .lang-switch{display:inline-flex;background:rgba(255,255,255,.14);border-radius:999px;padding:3px;}
  .lang-switch button{border:0;background:transparent;color:#fff;padding:5px 11px;border-radius:999px;cursor:pointer;font-size:.82rem;font-weight:600;opacity:.8;}
  .lang-switch button.active{background:#fff;color:var(--primary-dark);opacity:1;}
  .lang-sel{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:7px 12px;font-size:.85rem;font-weight:600;cursor:pointer;max-width:170px;}
  .lang-sel option{color:#1a2330;}

  /* Theme toggle (sun/moon) */
  .theme-toggle{border:0;background:none;padding:0;cursor:pointer;}
  .tt-track{direction:ltr;position:relative;display:inline-flex;align-items:center;justify-content:space-between;width:64px;height:30px;border-radius:999px;background:rgba(0,0,0,.28);box-shadow:inset 0 2px 5px rgba(0,0,0,.4);padding:0 7px;}
  .tt-track .tt-ic{font-size:.78rem;opacity:.7;}
  .tt-knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#f59e0b;display:flex;align-items:center;justify-content:center;font-size:.82rem;box-shadow:0 2px 6px rgba(0,0,0,.45);transition:left .22s,background .22s;}
  .tt-knob::after{content:"☀️";}
  :root[data-theme="dark"] .tt-knob{left:37px;background:#3b82f6;}
  :root[data-theme="dark"] .tt-knob::after{content:"🌙";}

  /* Dark-mode component tweaks */
  :root[data-theme="dark"] .content h4,:root[data-theme="dark"] .links-box h4,:root[data-theme="dark"] .docs-box h4,:root[data-theme="dark"] .wl-head{color:#5eead4;}
  :root[data-theme="dark"] a{color:#5eead4;}
  :root[data-theme="dark"] .btn-ghost,:root[data-theme="dark"] .back-link,:root[data-theme="dark"] .link-row,:root[data-theme="dark"] .docs-box,:root[data-theme="dark"] .method-pane,:root[data-theme="dark"] .steps,:root[data-theme="dark"] .addr,:root[data-theme="dark"] .pay-methods button,:root[data-theme="dark"] .list-item,:root[data-theme="dark"] .order-card{background:#2f3647;color:var(--text);}
  :root[data-theme="dark"] .btn-ghost:hover,:root[data-theme="dark"] .link-row:hover{background:#3a4258;}
  :root[data-theme="dark"] .pay-methods button.active{background:#20423c;border-color:var(--primary);}
  :root[data-theme="dark"] .verify-note{background:#243650;border-color:#345574;color:#bcd6f5;}
  :root[data-theme="dark"] .disclaimer{background:#3a3320;border-color:#5c4e22;color:#f0d79a;}
  :root[data-theme="dark"] .docs-list li{border-color:#3d465e;}
  :root[data-theme="dark"] .content .callout{background:#153a2e;border-color:#2f6a53;color:#b7f0d6;}
  :root[data-theme="dark"] .content .callout b{color:#dcfce7;}
  :root[data-theme="dark"] .pay-box{background:linear-gradient(135deg,#353d52,#3a3524);border-color:#5c4e22;}
  :root[data-theme="dark"] input,:root[data-theme="dark"] textarea,:root[data-theme="dark"] select{background:#2f3647;color:var(--text);border-color:var(--border);}
  :root[data-theme="dark"] .loc-bar{background:#223c44;border-color:#2f5f55;}
  :root[data-theme="dark"] .lang-pick button{background:#2f3647;color:var(--text);}
  :root[data-theme="dark"] .lang-pick button.active{background:#20423c;color:#99f6e4;}
  :root[data-theme="dark"] .pill{background:#454e66;color:#cdd6e6;}
  .edit-lang-hint{background:#eef6ff;border:1px solid #cfe3fb;border-radius:10px;padding:10px 12px;margin-top:12px;}
  :root[data-theme="dark"] .edit-lang-hint{background:#243650;border-color:#345574;}
  :root[data-theme="dark"] .modal-overlay{background:rgba(0,0,0,.65);}
  :root[data-theme="dark"] .site-header{background:linear-gradient(135deg,#0f766e 0%,#0b4f4a 55%,#0a3d3a 100%);}

  /* Note editor (RTE) */
  .rte-bar{display:flex;flex-wrap:wrap;gap:4px;border:1px solid var(--border);border-bottom:0;border-radius:10px 10px 0 0;padding:6px;background:#f3f6fa;}
  .rte-bar button{border:1px solid var(--border);background:#fff;border-radius:7px;padding:4px 10px;cursor:pointer;font-size:.84rem;font-family:inherit;font-weight:700;color:var(--text);min-width:32px;}
  .rte-bar button:hover{background:#eef2f7;}
  .rte{min-height:170px;max-height:360px;overflow:auto;border:1px solid var(--border);border-radius:0 0 10px 10px;padding:10px 12px;line-height:1.7;background:#fff;color:var(--text);}
  .rte:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--ring);}
  .rte h3{font-size:1.1rem;margin:8px 0 4px;}
  .rte h4{font-size:1rem;margin:8px 0 4px;color:var(--primary-dark);}
  .rte ul,.rte ol{padding-inline-start:22px;}
  .doc-dl{margin-inline-start:8px;font-size:.8rem;font-weight:700;color:var(--primary);text-decoration:none;white-space:nowrap;}
  .doc-dl:hover{text-decoration:underline;}
  :root[data-theme="dark"] .rte-bar{background:#2f3647;}
  :root[data-theme="dark"] .rte-bar button{background:#3a4258;color:var(--text);}
  :root[data-theme="dark"] .rte{background:#2f3647;}
  :root[data-theme="dark"] .rte h4{color:#5eead4;}

  /* Buttons */
  .btn{display:inline-flex;align-items:center;gap:7px;cursor:pointer;border:0;border-radius:11px;padding:11px 18px;font-size:.95rem;font-weight:700;text-decoration:none;transition:transform .05s,box-shadow .15s,background .15s;font-family:inherit;}
  .btn:active{transform:translateY(1px);}
  .btn-accent{background:var(--accent);color:#3a2a05;box-shadow:0 4px 12px rgba(245,158,11,.35);}
  .btn-accent:hover{background:var(--accent-dark);}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-ghost{background:#eef2f7;color:var(--text);}
  .btn-ghost:hover{background:#e3e9f1;}
  .btn-danger{background:#fde8e8;color:#b42318;}
  .btn-success{background:#dcfce7;color:#166534;}
  .btn-sm{padding:7px 12px;font-size:.82rem;border-radius:9px;}
  .btn-block{width:100%;justify-content:center;}
  .btn[disabled]{opacity:.5;cursor:not-allowed;}

  /* Banner "buttons" — stacked vertically, glossy 3D */
  .banner-grid{display:flex;flex-direction:column;gap:16px;margin:22px auto;max-width:640px;}
  .banner{position:relative;border-radius:16px;padding:16px 20px;color:#fff;cursor:pointer;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:14px;border:0;text-align:inherit;font-family:inherit;transition:transform .12s,filter .18s;}
  .banner::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.32) 0%,rgba(255,255,255,.07) 45%,rgba(255,255,255,0) 62%);pointer-events:none;}
  .banner:hover{transform:translateY(-2px);filter:brightness(1.06) saturate(1.04);}
  .banner:active{transform:translateY(1px);}
  .banner .b-left{display:flex;align-items:center;gap:14px;min-width:0;z-index:1;}
  .banner .b-ic{font-size:1.9rem;line-height:1;flex:0 0 auto;filter:drop-shadow(0 2px 3px rgba(0,0,0,.28));}
  .banner .b-txt{min-width:0;}
  .banner .b-title{display:block;font-size:1.1rem;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.3);}
  .banner .b-desc{display:block;font-size:.84rem;opacity:.95;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.22);}
  .banner .b-right{display:flex;align-items:center;gap:10px;z-index:1;flex:0 0 auto;}
  .banner .arrow{font-size:1.3rem;opacity:.9;}
  .badge{font-size:.78rem;font-weight:800;background:rgba(255,255,255,.28);padding:5px 12px;border-radius:999px;color:#fff;white-space:nowrap;}
  .badge.free{background:rgba(255,255,255,.3);}

  /* Panels / content */
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 22px 26px;margin:16px 0;}
  .content h3{margin-top:0;font-size:1.35rem;}
  .content h4{margin:18px 0 6px;color:var(--primary-dark);}
  .content ul,.content ol{padding-inline-start:22px;}
  .content li{margin:4px 0;}
  .content .fr{font-size:.85rem;color:var(--muted);font-weight:500;margin-inline-start:6px;}
  .muted{color:var(--muted);font-size:.9rem;}
  .content .callout{background:#ecfdf5;border:1px solid #a7f3d0;border-inline-start:4px solid #059669;border-radius:10px;padding:12px 14px;margin:14px 0;color:#0f5132;font-size:.92rem;}
  .content .callout b{color:#064e3b;}
  .back-link{display:inline-flex;align-items:center;gap:6px;background:#eef2f7;border:0;border-radius:9px;padding:7px 13px;font-weight:700;cursor:pointer;margin-bottom:14px;font-family:inherit;font-size:.9rem;}

  .links-box{margin-top:18px;border-top:1px dashed var(--border);padding-top:14px;}
  .links-box h4{margin:0 0 8px;color:var(--primary-dark);}
  .link-row{display:flex;align-items:center;gap:9px;background:#f7faf9;border:1px solid var(--border);border-radius:10px;padding:9px 12px;margin:7px 0;text-decoration:none;color:var(--text);font-weight:600;}
  .link-row:hover{border-color:var(--primary);background:#eefaf7;}
  .link-row .ext{margin-inline-start:auto;color:var(--primary);font-size:.85rem;}
  .verify-note{background:#eef6ff;border:1px solid #cfe3fb;color:#1e487a;border-radius:9px;padding:9px 12px;font-size:.82rem;margin-top:10px;}

  .disclaimer{background:#fff8ec;border:1px solid #f6e3bd;color:#7a5a12;border-radius:10px;padding:11px 14px;font-size:.86rem;margin-top:14px;}

  /* Locked / checkout */
  .locked-head{text-align:center;padding:6px 0 2px;}
  .locked-head .big{font-size:2.4rem;}
  .price-tag{font-size:1.9rem;font-weight:900;color:var(--accent-dark);}
  .pay-methods{display:flex;gap:8px;margin:14px 0;}
  .pay-methods button{flex:1;border:2px solid var(--border);background:#fff;border-radius:12px;padding:12px;cursor:pointer;font-weight:800;font-family:inherit;font-size:.95rem;display:flex;flex-direction:column;align-items:center;gap:4px;}
  .pay-methods button.active{border-color:var(--primary);background:#eefaf7;}
  .pay-methods .pm-ic{font-size:1.4rem;}
  .method-pane{background:#f9fbfc;border:1px solid var(--border);border-radius:12px;padding:16px;margin-top:6px;}
  .qr-wrap{display:flex;justify-content:center;margin:12px 0;}
  .qr-wrap>div,.qr-wrap canvas,.qr-wrap img{background:#fff;padding:10px;border-radius:12px;box-shadow:var(--shadow);}
  .addr{font-family:ui-monospace,Menlo,Consolas,monospace;background:#fff;border:1px dashed var(--primary);border-radius:9px;padding:10px;word-break:break-all;font-size:.86rem;display:flex;align-items:center;gap:8px;}
  .addr button{margin-inline-start:auto;flex:0 0 auto;}
  .net-pill{display:inline-block;background:#fff3d6;color:#9a6a0a;font-weight:800;font-size:.78rem;padding:3px 10px;border-radius:999px;}
  .steps{font-size:.88rem;background:#fff;border-radius:9px;padding:10px 12px;border:1px solid var(--border);}

  /* Forms */
  label.field{display:block;margin:12px 0 4px;font-weight:600;font-size:.9rem;}
  input[type=text],input[type=url],input[type=email],input[type=password],input[type=number],textarea,select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:.95rem;font-family:inherit;background:#fff;color:var(--text);}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--ring);}
  textarea{min-height:150px;resize:vertical;line-height:1.6;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row>*{flex:1 1 170px;}
  .unlock-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .unlock-row input{flex:1;text-transform:uppercase;letter-spacing:1px;text-align:center;}

  /* Admin */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px;}
  .card h2{margin:0 0 12px;font-size:1.08rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .list-item{display:flex;align-items:center;gap:10px;justify-content:space-between;border:1px solid var(--border);border-radius:10px;padding:9px 12px;margin:8px 0;background:#fcfdff;flex-wrap:wrap;}
  .list-item .meta{display:flex;align-items:center;gap:9px;min-width:0;}
  .swatch{width:16px;height:16px;border-radius:5px;flex:0 0 auto;border:1px solid rgba(0,0,0,.1);}
  .t-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pill{font-size:.72rem;padding:2px 8px;border-radius:999px;background:#eef2f7;color:var(--muted);}
  .pill.price{background:#fff1d6;color:#9a6a0a;font-weight:800;}
  .pill.free{background:#dcfce7;color:#166534;}
  .pill.pending{background:#fef3c7;color:#92600a;}
  .pill.approved{background:#dcfce7;color:#166534;}
  .pill.rejected{background:#fde8e8;color:#b42318;}
  .item-actions{display:flex;gap:5px;flex-wrap:wrap;}
  .code-chip{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;letter-spacing:1px;}
  .order-card{border:1px solid var(--border);border-radius:11px;padding:12px;margin:9px 0;background:#fcfdff;}
  .order-card .orow{font-size:.86rem;margin:2px 0;}
  .order-card .lbl{color:var(--muted);display:inline-block;min-width:90px;}

  .toast{position:fixed;bottom:18px;inset-inline-start:50%;transform:translateX(-50%);background:#142033;color:#fff;padding:10px 18px;border-radius:10px;font-size:.9rem;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .25s,bottom .25s;z-index:60;}
  .toast.show{opacity:1;bottom:28px;}
  .toast.err{background:#8a1c13;}
  /* Welcome popup */
  .modal-overlay{position:fixed;inset:0;background:rgba(10,20,35,.6);z-index:70;display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto;}
  .modal-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:22px;max-width:460px;width:100%;}
  .wl-head{font-size:1.3rem;font-weight:800;text-align:center;color:var(--primary-dark);}
  .wl-sub{text-align:center;color:var(--muted);font-size:.86rem;margin:4px 0 16px;}
  .wl-label{font-weight:700;font-size:.9rem;margin:14px 0 6px;}
  .lang-pick{display:flex;gap:8px;}
  .lang-pick button{flex:1;border:2px solid var(--border);background:#fff;border-radius:10px;padding:10px;cursor:pointer;font-weight:700;font-family:inherit;font-size:.92rem;}
  .lang-pick button.active{border-color:var(--primary);background:#eefaf7;color:var(--primary-dark);}

  .loc-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#eefaf7;border:1px solid #bfe6df;border-radius:12px;padding:8px 14px;margin:14px 0 2px;font-size:.9rem;flex-wrap:wrap;}

  .docs-box{margin-top:18px;background:#f6f8fb;border:1px solid var(--border);border-radius:12px;padding:12px 16px;}
  .docs-box h4{margin:0 0 8px;color:var(--primary-dark);}
  .docs-list{list-style:none;padding:0;margin:0;}
  .docs-list li{padding:7px 0 7px 26px;position:relative;border-bottom:1px solid #eef2f7;}
  .docs-list li:last-child{border-bottom:0;}
  .docs-list li::before{content:"📄";position:absolute;inset-inline-start:0;}
  html[dir=rtl] .docs-list li{padding:7px 26px 7px 0;}
  .c-tag{display:inline-block;background:#fff1d6;color:#9a6a0a;font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:999px;margin-inline-start:6px;}
  .link-row .c-tag{margin-inline-start:auto;}

  .footer{text-align:center;color:var(--muted);font-size:.85rem;padding:26px 0 36px;}
  .footer a{margin:0 8px;}
  .loading{text-align:center;padding:40px;color:var(--muted);}
  .hidden{display:none !important;}
  @media(max-width:560px){.brand h1{font-size:1.25rem;}.banner{padding:14px 16px;}.banner .b-title{font-size:1rem;}.banner .b-ic{font-size:1.6rem;}}
</style>
