<style>
  :root {
    --bg: #f4f6f9;
    --surface: #ffffff;
    --text: #1a2330;
    --muted: #5b6676;
    --primary: #0f766e;
    --primary-dark: #0b5952;
    --accent: #f59e0b;
    --accent-dark: #c9810a;
    --border: #e3e8ef;
    --ring: rgba(15,118,110,.18);
    --radius: 14px;
    --shadow: 0 6px 22px rgba(20,40,70,.07);
    --max: 980px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", Tahoma, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--primary); }
  .wrap { max-width: var(--max); margin: 0 auto; padding: 0 16px; }

  /* Header */
  .site-header {
    background: linear-gradient(135deg, var(--primary) 0%, #115e59 55%, #134e4a 100%);
    color: #fff;
    padding: 26px 0 20px;
  }
  .site-header .wrap { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; }
  .brand h1 { margin: 0; font-size: 1.5rem; letter-spacing: .2px; }
  .brand p { margin: 4px 0 0; opacity: .9; font-size: .92rem; max-width: 640px; }
  .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .lang-switch { display: inline-flex; background: rgba(255,255,255,.14); border-radius: 999px; padding: 3px; }
  .lang-switch button {
    border: 0; background: transparent; color: #fff; padding: 5px 11px; border-radius: 999px;
    cursor: pointer; font-size: .82rem; font-weight: 600; opacity: .8;
  }
  .lang-switch button.active { background: #fff; color: var(--primary-dark); opacity: 1; }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    border: 0; border-radius: 10px; padding: 10px 16px; font-size: .92rem; font-weight: 700;
    text-decoration: none; transition: transform .05s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn-accent { background: var(--accent); color: #3a2a05; box-shadow: 0 4px 12px rgba(245,158,11,.35); }
  .btn-accent:hover { background: var(--accent-dark); }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-ghost { background: #eef2f7; color: var(--text); }
  .btn-ghost:hover { background: #e3e9f1; }
  .btn-danger { background: #fde8e8; color: #b42318; }
  .btn-danger:hover { background: #fbd5d5; }
  .btn-sm { padding: 6px 11px; font-size: .82rem; border-radius: 8px; }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }

  /* Tabs */
  .tabs { display: flex; gap: 8px; overflow-x: auto; padding: 14px 0 4px; margin-top: 6px; scrollbar-width: thin; }
  .tab {
    flex: 0 0 auto; display: inline-flex; align-items: center; gap: 7px;
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 9px 15px; border-radius: 999px; cursor: pointer; font-size: .9rem; font-weight: 600;
    white-space: nowrap; box-shadow: var(--shadow);
  }
  .tab .ic { font-size: 1.05rem; }
  .tab .lock { font-size: .78rem; opacity: .7; }
  .tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  /* Content */
  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 22px 22px 26px; margin: 16px 0;
  }
  .content h3 { margin-top: 0; font-size: 1.3rem; }
  .content h4 { margin: 18px 0 6px; color: var(--primary-dark); }
  .content ul, .content ol { padding-inline-start: 22px; }
  .content li { margin: 4px 0; }
  .content .fr { font-size: .85rem; color: var(--muted); font-weight: 500; display: inline-block; margin-inline-start: 6px; }
  .content .muted, .muted { color: var(--muted); font-size: .9rem; }

  .disclaimer {
    background: #fff8ec; border: 1px solid #f6e3bd; color: #7a5a12;
    border-radius: 10px; padding: 11px 14px; font-size: .86rem; margin-top: 14px;
  }

  /* Pay / locked */
  .pay-box {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px; justify-content: space-between;
    background: linear-gradient(135deg, #fff 0%, #fffaf0 100%);
    border: 1px solid #f1e2c4; border-radius: var(--radius); padding: 16px 18px; margin: 16px 0;
  }
  .pay-box .price { font-size: 1.5rem; font-weight: 800; color: var(--accent-dark); }
  .locked-box { text-align: center; padding: 10px 0 4px; }
  .locked-box .big-lock { font-size: 2.4rem; }
  .unlock-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
  .unlock-row input {
    padding: 9px 12px; border: 1px solid var(--border); border-radius: 9px; font-size: .95rem;
    text-transform: uppercase; letter-spacing: 1px; width: 180px; text-align: center;
  }

  /* Forms */
  label.field { display: block; margin: 12px 0 4px; font-weight: 600; font-size: .9rem; }
  input[type=text], input[type=url], input[type=email], input[type=password], textarea, select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
    font-size: .95rem; font-family: inherit; background: #fff; color: var(--text);
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--ring); }
  textarea { min-height: 170px; resize: vertical; line-height: 1.6; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > * { flex: 1 1 180px; }

  /* Admin layout */
  .admin-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 18px 20px; }
  .card h2 { margin: 0 0 12px; font-size: 1.08rem; display: flex; align-items: center; gap: 8px; }
  .list-item {
    display: flex; align-items: center; gap: 10px; justify-content: space-between;
    border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; margin: 8px 0; background: #fcfdff;
  }
  .list-item .meta { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .list-item .t-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { font-size: .72rem; padding: 2px 8px; border-radius: 999px; background: #eef2f7; color: var(--muted); }
  .pill.lock { background: #fff1d6; color: #9a6a0a; }
  .item-actions { display: flex; gap: 5px; flex-wrap: wrap; }
  .code-chip { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 700; letter-spacing: 1px; }

  .toast {
    position: fixed; bottom: 18px; inset-inline-start: 50%; transform: translateX(-50%);
    background: #142033; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: .9rem;
    box-shadow: 0 8px 24px rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .25s, bottom .25s; z-index: 50;
  }
  .toast.show { opacity: 1; bottom: 28px; }
  .toast.err { background: #8a1c13; }

  .footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 26px 0 36px; }
  .footer a { margin: 0 8px; }

  .loading { text-align: center; padding: 40px; color: var(--muted); }
  .hidden { display: none !important; }

  @media (max-width: 560px) {
    .brand h1 { font-size: 1.25rem; }
    .pay-box .price { font-size: 1.3rem; }
  }
</style>
