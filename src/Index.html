<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <?!= include('Styles'); ?>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <!-- WELCOME POPUP -->
  <div id="welcome" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="wl-head">🌍 مرحباً · Bienvenue · Welcome</div>
      <p class="wl-sub">اختر لغتك وبلدك · Choisissez votre langue et pays · Choose your language and country</p>

      <div class="wl-label">🗣️ اللغة · Langue · Language</div>
      <div class="lang-pick" id="wlLang">
        <button data-l="ar">العربية</button>
        <button data-l="fr">Français</button>
        <button data-l="en">English</button>
      </div>

      <div class="wl-label" id="wlOriginL">بلدك الأصلي · Pays d'origine · Country of origin</div>
      <select id="wlOrigin"></select>

      <div class="wl-label" id="wlCurrentL">البلد الذي أنت فيه الآن · Pays où vous êtes · Country you are in now</div>
      <select id="wlCurrent"></select>

      <button class="btn btn-primary btn-block" id="wlStart" style="margin-top:16px" onclick="startVisit()">ابدأ · Commencer · Start →</button>
    </div>
  </div>

  <header class="site-header">
    <div class="wrap">
      <div class="brand">
        <h1 id="siteTitle">…</h1>
        <p id="siteSubtitle"></p>
      </div>
      <div class="header-actions">
        <button id="themeToggle" class="theme-toggle" onclick="toggleTheme()" aria-label="theme" title="Dark / Light"><span class="tt-track"><span class="tt-ic">☀️</span><span class="tt-ic">🌙</span><span class="tt-knob"></span></span></button>
        <select class="lang-sel" id="langSel" aria-label="language"></select>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div id="locBar" class="loc-bar hidden"></div>
    <div id="loading" class="loading">⏳ …</div>

    <section id="home" class="hidden">
      <div class="banner-grid" id="bannerGrid"></div>
      <div id="disclaimer" class="disclaimer hidden"></div>
    </section>

    <section id="topic" class="hidden">
      <button class="back-link" onclick="goHome()">◂ <span id="backLbl">رجوع</span></button>
      <div id="topicBody" class="panel content"></div>
    </section>
  </div>

  <footer class="footer">
    <div id="footerContact"></div>
    <div style="margin-top:6px">© <span id="year"></span> · <span id="siteTitleFoot"></span></div>
  </footer>

  <div class="toast" id="toast"></div>

  <script>
    var DATA=null, LANG='ar', CURRENT=null, PAYMETHOD='paypal', CURC='', ORIGIN='', POPLANG='ar';
    var AFRICA=['Algeria','Angola','Benin','Botswana','Burkina Faso','Burundi','Cabo Verde','Cameroon','Central African Republic','Chad','Comoros','Congo (Republic)','Congo (DRC)','Côte d\'Ivoire','Djibouti','Egypt','Equatorial Guinea','Eritrea','Eswatini','Ethiopia','Gabon','Gambia','Ghana','Guinea','Guinea-Bissau','Kenya','Lesotho','Liberia','Libya','Madagascar','Malawi','Mali','Mauritania','Mauritius','Morocco','Mozambique','Namibia','Niger','Nigeria','Rwanda','São Tomé and Príncipe','Senegal','Seychelles','Sierra Leone','Somalia','South Africa','South Sudan','Sudan','Tanzania','Togo','Tunisia','Uganda','Zambia','Zimbabwe'];

    var T={
      ar:{back:'رجوع',free:'مجاني',buy:'احصل على المعلومة',official:'روابط رسمية',docs:'الوثائق اللازمة',locked:'محتوى مدفوع',haveCode:'لديّ رمز وصول',enterCode:'أدخل رمز الوصول',unlock:'فتح',badCode:'رمز غير صحيح',unlocked:'تم الفتح ✓',pay:'طريقة الدفع',amount:'المبلغ',network:'الشبكة',afterPay:'بعد الدفع، أكمل النموذج أدناه لنرسل لك رمز الوصول:',contact:'بريدك أو رقم واتساب',proof:'رقم العملية / مرجع الدفع (TxID)',send:'إرسال الطلب',sent:'تم استلام طلبك ✓ سنراجع الدفع ونرسل لك رمز الوصول.',fill:'يرجى ملء التواصل ورقم العملية.',payPaypalBtn:'ادفع عبر PayPal',openBybit:'افتح Bybit وحوّل USDT إلى هذا العنوان',copy:'نسخ',copied:'تم النسخ ✓',scanPay:'امسح الكود للدفع عبر الهاتف',changeLoc:'تغيير',youIn:'أنت في'},
      fr:{back:'Retour',free:'Gratuit',buy:'Obtenir l\'info',official:'Liens officiels',docs:'Documents requis',locked:'Contenu payant',haveCode:'J\'ai un code',enterCode:'Code d\'accès',unlock:'Débloquer',badCode:'Code invalide',unlocked:'Débloqué ✓',pay:'Moyen de paiement',amount:'Montant',network:'Réseau',afterPay:'Après paiement, remplissez ce formulaire pour recevoir votre code :',contact:'Email ou WhatsApp',proof:'ID de transaction (TxID) / réf.',send:'Envoyer la demande',sent:'Demande reçue ✓ Nous vérifions et envoyons votre code.',fill:'Remplissez contact et TxID.',payPaypalBtn:'Payer avec PayPal',openBybit:'Ouvrez Bybit et envoyez l\'USDT à cette adresse',copy:'Copier',copied:'Copié ✓',scanPay:'Scannez pour payer',changeLoc:'Changer',youIn:'Vous êtes en'},
      en:{back:'Back',free:'Free',buy:'Get the info',official:'Official links',docs:'Required documents',locked:'Paid content',haveCode:'I have a code',enterCode:'Access code',unlock:'Unlock',badCode:'Invalid code',unlocked:'Unlocked ✓',pay:'Payment method',amount:'Amount',network:'Network',afterPay:'After paying, fill this form to receive your code:',contact:'Email or WhatsApp',proof:'Transaction ID (TxID) / ref',send:'Send request',sent:'Request received ✓ We will verify and send your code.',fill:'Fill contact and TxID.',payPaypalBtn:'Pay with PayPal',openBybit:'Open Bybit and send USDT to this address',copy:'Copy',copied:'Copied ✓',scanPay:'Scan to pay',changeLoc:'Change',youIn:'You are in'}
    };
    function t(k){return (T[LANG]&&T[LANG][k])||T.en[k]||T.ar[k]||k;}
    function pick(o){if(!o)return '';if(typeof o==='string')return o;if(o[LANG])return o[LANG];var order=[LANG,'en','fr','ar'];for(var i=0;i<order.length;i++){if(o[order[i]])return o[order[i]];}for(var k in o){if(o[k])return o[k];}return '';}
    function langDir(code){var ls=(DATA&&DATA.settings&&DATA.settings.languages)||[];var f=ls.filter(function(x){return x.code===code;})[0];return f?(f.dir||'ltr'):(code==='ar'?'rtl':'ltr');}
    function toast(m,e){var el=document.getElementById('toast');el.textContent=m;el.className='toast show'+(e?' err':'');setTimeout(function(){el.className='toast';},2600);}
    function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
    function countryLabel(code){var cs=(DATA&&DATA.settings&&DATA.settings.countries)||[];var f=cs.filter(function(x){return x.code===code;})[0];return f?pick(f.label):code;}
    function matchCountry(c){if(!CURC)return true;if(CURC==='OTHER')return !c;return !c||c===CURC;}

    function setLang(l){
      LANG=l;
      document.documentElement.setAttribute('dir',langDir(l));
      document.documentElement.setAttribute('lang',l);
      var sel=document.getElementById('langSel'); if(sel&&sel.value!==l) sel.value=l;
      document.getElementById('backLbl').textContent=t('back');
      try{localStorage.setItem('guide_lang',l);}catch(e){}
      renderLocBar();
      if(CURRENT) openTopic(CURRENT); else if(DATA) renderBanners();
    }

    function toggleTheme(){var cur=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',cur);try{localStorage.setItem('guide_theme',cur);}catch(e){}}
    function initTheme(){var th;try{th=localStorage.getItem('guide_theme');}catch(e){}if(!th)th=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';document.documentElement.setAttribute('data-theme',th);}
    function hexA(hex,a){try{var n=parseInt(hex.slice(1),16);return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';}catch(e){return hex;}}
    function init(){
      initTheme();
      document.getElementById('year').textContent=new Date().getFullYear();
      document.getElementById('langSel').addEventListener('change',function(){setLang(this.value);});
      [].forEach.call(document.querySelectorAll('#wlLang button'),function(b){b.addEventListener('click',function(){setPopLang(b.getAttribute('data-l'));});});
      google.script.run.withSuccessHandler(onData).withFailureHandler(function(e){document.getElementById('loading').textContent='⚠️ '+e.message;}).getPublicData();
    }

    function onData(d){
      DATA=d; var s=d.settings||{};
      var langs=s.languages||[{code:'ar',label:'العربية',dir:'rtl'}];
      var sel=document.getElementById('langSel'); sel.innerHTML='';
      langs.forEach(function(L){var op=document.createElement('option');op.value=L.code;op.textContent=L.label;sel.appendChild(op);});
      document.getElementById('siteTitle').textContent=s.siteTitle||'';
      document.getElementById('siteTitleFoot').textContent=s.siteTitle||'';
      document.getElementById('siteSubtitle').textContent=s.siteSubtitle||'';
      if(s.disclaimer){var dd=document.getElementById('disclaimer');dd.textContent=s.disclaimer;dd.classList.remove('hidden');}
      var fc=[];
      if(s.contactEmail) fc.push('✉️ <a href="mailto:'+esc(s.contactEmail)+'">'+esc(s.contactEmail)+'</a>');
      if(s.whatsapp) fc.push('💬 <a target="_blank" rel="noopener" href="https://wa.me/'+String(s.whatsapp).replace(/[^0-9]/g,'')+'">WhatsApp</a>');
      document.getElementById('footerContact').innerHTML=fc.join(' · ');
      document.getElementById('loading').classList.add('hidden');

      // restore prefs
      var pref=null; try{pref=JSON.parse(localStorage.getItem('visitor_pref')||'null');}catch(e){}
      if(pref&&pref.current){ LANG=pref.lang||'ar'; CURC=pref.current; ORIGIN=pref.origin||''; applyLangNoRender(); renderBanners(); renderLocBar(); }
      else { buildWelcome(); showWelcome(); }
    }

    function applyLangNoRender(){
      document.documentElement.setAttribute('dir',langDir(LANG));
      document.documentElement.setAttribute('lang',LANG);
      var sel=document.getElementById('langSel'); if(sel) sel.value=LANG;
      document.getElementById('backLbl').textContent=t('back');
    }

    /* ---- Welcome popup ---- */
    function setPopLang(l){ POPLANG=l; [].forEach.call(document.querySelectorAll('#wlLang button'),function(b){b.classList.toggle('active',b.getAttribute('data-l')===l);}); buildCurrentOptions(); }
    function buildWelcome(){
      POPLANG=LANG||'ar';
      [].forEach.call(document.querySelectorAll('#wlLang button'),function(b){b.classList.toggle('active',b.getAttribute('data-l')===POPLANG);});
      var o=document.getElementById('wlOrigin'); o.innerHTML='<option value="">— —</option>';
      AFRICA.forEach(function(c){var op=document.createElement('option');op.value=c;op.textContent=c;o.appendChild(op);});
      var opx=document.createElement('option');opx.value='Other';opx.textContent='Other / أخرى';o.appendChild(opx);
      buildCurrentOptions();
    }
    function buildCurrentOptions(){
      var cur=document.getElementById('wlCurrent'); var prev=cur.value; cur.innerHTML='<option value="">— —</option>';
      ((DATA&&DATA.settings&&DATA.settings.countries)||[]).forEach(function(c){var op=document.createElement('option');op.value=c.code;op.textContent=(c.label&&(c.label[POPLANG]||c.label.en||c.label.ar))||c.code;cur.appendChild(op);});
      cur.value=prev;
    }
    function showWelcome(){document.getElementById('welcome').classList.remove('hidden');}
    function hideWelcome(){document.getElementById('welcome').classList.add('hidden');}
    function openWelcome(){ buildWelcome(); document.getElementById('wlOrigin').value=ORIGIN||''; document.getElementById('wlCurrent').value=CURC||''; showWelcome(); }
    function startVisit(){
      LANG=POPLANG; CURC=document.getElementById('wlCurrent').value||''; ORIGIN=document.getElementById('wlOrigin').value||'';
      try{localStorage.setItem('visitor_pref',JSON.stringify({lang:LANG,current:CURC,origin:ORIGIN}));localStorage.setItem('guide_lang',LANG);}catch(e){}
      hideWelcome(); applyLangNoRender(); CURRENT=null; renderBanners(); renderLocBar();
    }

    function renderLocBar(){
      var bar=document.getElementById('locBar');
      if(!CURC){bar.classList.add('hidden');return;}
      bar.classList.remove('hidden');
      bar.innerHTML='<span>📍 '+t('youIn')+': <b>'+esc(countryLabel(CURC))+'</b></span>'+
        '<button class="btn btn-ghost btn-sm" onclick="openWelcome()">🔄 '+t('changeLoc')+'</button>';
    }

    /* ---- Home / topics ---- */
    function renderBanners(){
      document.getElementById('topic').classList.add('hidden');
      document.getElementById('home').classList.remove('hidden');
      CURRENT=null;
      var g=document.getElementById('bannerGrid');g.innerHTML='';
      (DATA.tabs||[]).forEach(function(tb){
        var cur=(DATA.settings.currency||'€');
        var badge=tb.locked?('<span class="badge">'+tb.price+' '+esc(cur)+'</span>'):('<span class="badge free">'+t('free')+'</span>');
        var el=document.createElement('button');
        el.className='banner';
        el.style.background='linear-gradient(135deg,'+shade(tb.color,10)+' 0%,'+shade(tb.color,-22)+' 100%)';
        el.style.boxShadow='0 9px 22px '+hexA(tb.color,.45)+', inset 0 1px 0 rgba(255,255,255,.35)';
        el.innerHTML='<span class="b-left"><span class="b-ic">'+(tb.icon||'')+'</span><span class="b-txt"><span class="b-title">'+esc(pick(tb.title))+'</span><span class="b-desc">'+esc(pick(tb.desc))+'</span></span></span>'+
          '<span class="b-right">'+badge+'<span class="arrow">◂</span></span>';
        el.addEventListener('click',function(){openTopic(tb.id);});
        g.appendChild(el);
      });
    }
    function findTab(id){return (DATA.tabs||[]).filter(function(x){return x.id===id;})[0];}

    function openTopic(id){
      CURRENT=id;
      document.getElementById('home').classList.add('hidden');
      document.getElementById('topic').classList.remove('hidden');
      window.scrollTo(0,0);
      var tb=findTab(id); var body=document.getElementById('topicBody');
      if(!tb){body.innerHTML='';return;}
      if(!tb.locked){ body.innerHTML=renderContent(tb.content, tb.links, tb.docs); return; }
      var code; try{code=localStorage.getItem('unlock_'+id);}catch(e){}
      if(code && tb._content){ body.innerHTML=renderContent(tb._content, tb._links||[], tb._docs||[]); return; }
      renderCheckout(tb);
      if(code) tryUnlock(id,code,true);
    }

    function renderContent(content, links, docs){
      var out=pick(content)||'';
      // documents
      var dd=(docs||[]).filter(function(x){return matchCountry(x.country);});
      if(dd.length){
        out+='<div class="docs-box"><h4>📎 '+t('docs')+'</h4><ul class="docs-list">';
        dd.forEach(function(x){out+='<li>'+esc(pick(x.label))+(x.country?' <span class="c-tag">'+esc(countryLabel(x.country))+'</span>':'')+'</li>';});
        out+='</ul></div>';
      }
      // links filtered by country
      var ll=(links||[]).filter(function(x){return matchCountry(x.country);});
      if(ll.length){
        out+='<div class="links-box"><h4>🔗 '+t('official')+'</h4>';
        ll.forEach(function(l){ out+='<a class="link-row" target="_blank" rel="noopener" href="'+esc(l.url)+'"><span>🌐</span><span>'+esc(l.label)+'</span>'+(l.country?'<span class="c-tag">'+esc(countryLabel(l.country))+'</span>':'')+'<span class="ext">↗</span></a>'; });
        if(DATA.settings.verifyNote) out+='<div class="verify-note">'+esc(DATA.settings.verifyNote)+'</div>';
        out+='</div>';
      }
      return out;
    }

    function docsPreview(tb){
      var dd=(tb.docs||[]).filter(function(x){return matchCountry(x.country);});
      if(!dd.length) return '';
      var out='<div class="docs-box"><h4>📎 '+t('docs')+'</h4><ul class="docs-list">';
      dd.forEach(function(x){out+='<li>'+esc(pick(x.label))+(x.country?' <span class="c-tag">'+esc(countryLabel(x.country))+'</span>':'')+'</li>';});
      out+='</ul></div>';
      return out;
    }
    function renderCheckout(tb){
      var s=DATA.settings||{}; var cur=s.currency||'€';
      var body=document.getElementById('topicBody');
      body.innerHTML=
        '<div class="locked-head"><div class="big">🔒</div><h3>'+esc(pick(tb.title))+' · '+t('locked')+'</h3>'+
        '<p class="muted">'+esc(pick(tb.teaser)||'')+'…</p><div class="price-tag">'+tb.price+' '+esc(cur)+'</div></div>'+
        docsPreview(tb)+
        '<div class="pay-methods" id="pm">'+
          '<button data-m="paypal" class="active"><span class="pm-ic">🅿️</span>PayPal</button>'+
          '<button data-m="usdt"><span class="pm-ic">₮</span>USDT (Bybit)</button>'+
        '</div>'+
        '<div id="methodPane" class="method-pane"></div>'+
        '<div style="margin-top:16px"><b>'+t('afterPay')+'</b></div>'+
        '<label class="field">'+t('contact')+'</label><input id="o_contact" placeholder="email / +39…">'+
        '<label class="field">'+t('proof')+'</label><input id="o_proof" placeholder="TxID / PayPal ref">'+
        '<div style="margin-top:12px"><button class="btn btn-primary btn-block" onclick="submitOrder()">📨 '+t('send')+'</button></div>'+
        '<div style="margin-top:18px;border-top:1px dashed var(--border);padding-top:12px"><b>'+t('haveCode')+'</b>'+
          '<div class="unlock-row"><input id="u_code" placeholder="'+t('enterCode')+'" maxlength="12"><button class="btn btn-ghost" onclick="tryUnlock(\''+tb.id+'\',document.getElementById(\'u_code\').value)">🔓 '+t('unlock')+'</button></div></div>';
      PAYMETHOD='paypal';
      [].forEach.call(document.querySelectorAll('#pm button'),function(b){b.addEventListener('click',function(){
        PAYMETHOD=b.getAttribute('data-m');
        [].forEach.call(document.querySelectorAll('#pm button'),function(x){x.classList.toggle('active',x===b);});
        renderMethodPane(tb);
      });});
      renderMethodPane(tb);
    }

    function renderMethodPane(tb){
      var s=DATA.settings||{}; var cur=s.currency||'€'; var pane=document.getElementById('methodPane');
      if(PAYMETHOD==='paypal'){
        if(s.paypalUrl){
          pane.innerHTML='<p>'+t('amount')+': <b>'+tb.price+' '+esc(cur)+'</b></p>'+
            '<a class="btn btn-accent btn-block" target="_blank" rel="noopener" href="'+esc(s.paypalUrl)+'">🅿️ '+t('payPaypalBtn')+'</a>'+
            '<div class="qr-wrap" id="ppqr"></div><p class="muted" style="text-align:center">'+t('scanPay')+'</p>';
          var pq=document.getElementById('ppqr'); if(pq){pq.innerHTML='';try{new QRCode(pq,{text:s.paypalUrl,width:150,height:150});}catch(e){}}
        } else { pane.innerHTML='<p class="muted">PayPal غير مُفعّل بعد (أضف الرابط من لوحة التحكم).</p>'; }
      } else {
        var addr=s.usdtAddress||''; var net=s.usdtNetwork||'TRC20';
        pane.innerHTML='<p>'+t('amount')+': <b>'+tb.price+' USDT</b> · '+t('network')+': <span class="net-pill">'+esc(net)+'</span></p>'+
          (addr?('<p class="muted">'+t('openBybit')+'</p><div class="addr"><span id="usdtAddr">'+esc(addr)+'</span><button class="btn btn-ghost btn-sm" onclick="copyAddr()">📋 '+t('copy')+'</button></div><div class="qr-wrap" id="qr"></div>'):'<p class="muted">عنوان USDT غير مضبوط بعد.</p>')+
          (s.usdtNote?('<div class="steps">ℹ️ '+esc(s.usdtNote)+'</div>'):'');
        if(addr){var q=document.getElementById('qr');q.innerHTML='';try{new QRCode(q,{text:addr,width:160,height:160});}catch(e){}}
      }
    }
    function copyAddr(){var a=document.getElementById('usdtAddr');if(!a)return;var txt=a.textContent;if(navigator.clipboard){navigator.clipboard.writeText(txt).then(function(){toast(t('copied'));});}else{toast(t('copied'));}}

    function submitOrder(){
      var tb=findTab(CURRENT); if(!tb)return;
      var contact=document.getElementById('o_contact').value.trim();
      var proof=document.getElementById('o_proof').value.trim();
      if(!contact||!proof){toast(t('fill'),true);return;}
      var payload={tabId:tb.id,method:PAYMETHOD,proof:proof,contact:contact,origin:ORIGIN,current:CURC};
      google.script.run.withSuccessHandler(function(r){
        if(r&&r.ok){document.getElementById('topicBody').innerHTML='<div class="locked-head"><div class="big">✅</div><h3>'+t('sent')+'</h3><p class="muted">#'+r.orderId+'</p></div>';}
      }).withFailureHandler(function(e){toast(e.message,true);}).createOrder(payload);
    }

    function tryUnlock(id,code,silent){
      code=(code||'').trim().toUpperCase(); if(!code)return;
      google.script.run.withSuccessHandler(function(res){
        if(res&&res.ok){var tb=findTab(id);tb._content=res.content;tb._links=res.links||[];tb._docs=res.docs||[];
          try{localStorage.setItem('unlock_'+id,code);}catch(e){}
          document.getElementById('topicBody').innerHTML=renderContent(res.content,res.links||[],res.docs||[]);
          if(!silent) toast(t('unlocked'));
        } else if(!silent){ toast(t('badCode'),true); }
      }).getLockedContent(id,code);
    }

    function goHome(){ renderBanners(); }
    function shade(hex,p){try{var n=parseInt(hex.slice(1),16),r=(n>>16)+p*2.55,g=((n>>8)&255)+p*2.55,b=(n&255)+p*2.55;r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));return '#'+((1<<24)+(Math.round(r)<<16)+(Math.round(g)<<8)+Math.round(b)).toString(16).slice(1);}catch(e){return hex;}}
    window.addEventListener('load',init);
  </script>
</body>
</html>
