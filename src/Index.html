<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <?!= include('Styles'); ?>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <div class="brand">
        <h1 id="siteTitle">…</h1>
        <p id="siteSubtitle"></p>
      </div>
      <div class="header-actions">
        <select class="lang-sel" id="langSel" aria-label="language"></select>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div id="loading" class="loading">⏳ …</div>

    <!-- HOME: banners -->
    <section id="home" class="hidden">
      <div class="banner-grid" id="bannerGrid"></div>
      <div id="disclaimer" class="disclaimer hidden"></div>
    </section>

    <!-- TOPIC -->
    <section id="topic" class="hidden">
      <button class="back-link" onclick="goHome()">◂ <span id="backLbl">رجوع</span></button>
      <div id="topicBody" class="panel content"></div>
    </section>
  </div>

  <footer class="footer">
    <div id="footerContact"></div>
    <div style="margin-top:6px">© <span id="year"></span> · <span id="siteTitleFoot"></span></div>
  </footer>

  <div class="toast" id="toast"></div>

  <script>
    var DATA=null, LANG='ar', CURRENT=null, PAYMETHOD='paypal';
    var COUNTRIES=['فرنسا France','إيطاليا Italia','إسبانيا España','ألمانيا Deutschland','بلجيكا Belgique','هولندا Nederland','دولة أوروبية أخرى'];
    var T={
      ar:{back:'رجوع',loading:'جارٍ التحميل…',free:'مجاني',buy:'احصل على المعلومة',official:'روابط رسمية',locked:'محتوى مدفوع',haveCode:'لديّ رمز وصول',enterCode:'أدخل رمز الوصول',unlock:'فتح',badCode:'رمز غير صحيح',unlocked:'تم الفتح ✓',pay:'طريقة الدفع',payPaypal:'PayPal',payUsdt:'USDT (Bybit)',copy:'نسخ',copied:'تم النسخ ✓',amount:'المبلغ',network:'الشبكة',afterPay:'بعد الدفع، أكمل النموذج أدناه لنرسل لك رمز الوصول:',country:'دولتك',contact:'بريدك أو رقم واتساب',proof:'رقم العملية / مرجع الدفع (TxID)',send:'إرسال الطلب',sent:'تم استلام طلبك ✓ سنراجع الدفع ونرسل لك رمز الوصول.',fill:'يرجى ملء المبلغ والتواصل ورقم العملية.',payPaypalBtn:'ادفع عبر PayPal',openBybit:'افتح Bybit وحوّل USDT إلى هذا العنوان',scanPay:'امسح الكود للدفع عبر الهاتف',contactL:'للتواصل'},
      fr:{back:'Retour',loading:'Chargement…',free:'Gratuit',buy:'Obtenir l\'info',official:'Liens officiels',locked:'Contenu payant',haveCode:'J\'ai un code',enterCode:'Code d\'accès',unlock:'Débloquer',badCode:'Code invalide',unlocked:'Débloqué ✓',pay:'Moyen de paiement',payPaypal:'PayPal',payUsdt:'USDT (Bybit)',copy:'Copier',copied:'Copié ✓',amount:'Montant',network:'Réseau',afterPay:'Après paiement, remplissez ce formulaire pour recevoir votre code :',country:'Votre pays',contact:'Email ou WhatsApp',proof:'ID de transaction (TxID) / réf.',send:'Envoyer la demande',sent:'Demande reçue ✓ Nous vérifions et envoyons votre code.',fill:'Remplissez montant, contact et TxID.',payPaypalBtn:'Payer avec PayPal',openBybit:'Ouvrez Bybit et envoyez l\'USDT à cette adresse',scanPay:'Scannez pour payer',contactL:'Contact'},
      en:{back:'Back',loading:'Loading…',free:'Free',buy:'Get the info',official:'Official links',locked:'Paid content',haveCode:'I have a code',enterCode:'Access code',unlock:'Unlock',badCode:'Invalid code',unlocked:'Unlocked ✓',pay:'Payment method',payPaypal:'PayPal',payUsdt:'USDT (Bybit)',copy:'Copy',copied:'Copied ✓',amount:'Amount',network:'Network',afterPay:'After paying, fill this form to receive your code:',country:'Your country',contact:'Email or WhatsApp',proof:'Transaction ID (TxID) / ref',send:'Send request',sent:'Request received ✓ We will verify and send your code.',fill:'Fill amount, contact and TxID.',payPaypalBtn:'Pay with PayPal',openBybit:'Open Bybit and send USDT to this address',scanPay:'Scan to pay',contactL:'Contact'}
    };
    function t(k){return (T[LANG]&&T[LANG][k])||T.en[k]||T.ar[k]||k;}
    function pick(o){if(!o)return '';if(typeof o==='string')return o;if(o[LANG])return o[LANG];var order=[LANG,'en','fr','ar'];for(var i=0;i<order.length;i++){if(o[order[i]])return o[order[i]];}for(var k in o){if(o[k])return o[k];}return '';}
    function langDir(code){var ls=(DATA&&DATA.settings&&DATA.settings.languages)||[];var f=ls.filter(function(x){return x.code===code;})[0];return f?(f.dir||'ltr'):(code==='ar'?'rtl':'ltr');}
    function toast(m,e){var el=document.getElementById('toast');el.textContent=m;el.className='toast show'+(e?' err':'');setTimeout(function(){el.className='toast';},2600);}
    function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

    function setLang(l){
      LANG=l;
      document.documentElement.setAttribute('dir',langDir(l));
      document.documentElement.setAttribute('lang',l);
      var sel=document.getElementById('langSel'); if(sel&&sel.value!==l) sel.value=l;
      document.getElementById('backLbl').textContent=t('back');
      try{localStorage.setItem('guide_lang',l);}catch(e){}
      if(CURRENT) openTopic(CURRENT); else if(DATA) renderBanners();
    }

    function init(){
      document.getElementById('year').textContent=new Date().getFullYear();
      document.getElementById('langSel').addEventListener('change',function(){setLang(this.value);});
      google.script.run.withSuccessHandler(onData).withFailureHandler(function(e){document.getElementById('loading').textContent='⚠️ '+e.message;}).getPublicData();
    }
    function onData(d){
      DATA=d; var s=d.settings||{};
      var langs=s.languages||[{code:'ar',label:'العربية',dir:'rtl'}];
      var sel=document.getElementById('langSel'); sel.innerHTML='';
      langs.forEach(function(L){var op=document.createElement('option');op.value=L.code;op.textContent=L.label;sel.appendChild(op);});
      var saved; try{saved=localStorage.getItem('guide_lang');}catch(e){}
      setLang(saved||s.lang||'ar');
      document.getElementById('siteTitle').textContent=s.siteTitle||'';
      document.getElementById('siteTitleFoot').textContent=s.siteTitle||'';
      document.getElementById('siteSubtitle').textContent=s.siteSubtitle||'';
      if(s.disclaimer){var dd=document.getElementById('disclaimer');dd.textContent=s.disclaimer;dd.classList.remove('hidden');}
      var fc=[];
      if(s.contactEmail) fc.push('✉️ <a href="mailto:'+esc(s.contactEmail)+'">'+esc(s.contactEmail)+'</a>');
      if(s.whatsapp) fc.push('💬 <a target="_blank" rel="noopener" href="https://wa.me/'+String(s.whatsapp).replace(/[^0-9]/g,'')+'">WhatsApp</a>');
      document.getElementById('footerContact').innerHTML=fc.join(' · ');
      document.getElementById('loading').classList.add('hidden');
      renderBanners();
    }

    function renderBanners(){
      document.getElementById('topic').classList.add('hidden');
      document.getElementById('home').classList.remove('hidden');
      CURRENT=null;
      var g=document.getElementById('bannerGrid');g.innerHTML='';
      (DATA.tabs||[]).forEach(function(tb){
        var cur=(DATA.settings.currency||'€');
        var badge=tb.locked?('<span class="badge">'+tb.price+' '+esc(cur)+'</span>'):('<span class="badge free">'+t('free')+'</span>');
        var el=document.createElement('button');
        el.className='banner';el.style.background='linear-gradient(135deg,'+tb.color+' 0%,'+shade(tb.color,-18)+' 100%)';
        el.innerHTML='<div><div class="b-ic">'+(tb.icon||'')+'</div><div class="b-title">'+esc(pick(tb.title))+'</div><div class="b-desc">'+esc(pick(tb.desc))+'</div></div>'+
          '<div class="b-foot">'+badge+'<span class="arrow">◂</span></div>';
        el.addEventListener('click',function(){openTopic(tb.id);});
        g.appendChild(el);
      });
    }

    function findTab(id){return (DATA.tabs||[]).filter(function(x){return x.id===id;})[0];}

    function openTopic(id){
      CURRENT=id;
      document.getElementById('home').classList.add('hidden');
      document.getElementById('topic').classList.remove('hidden');
      window.scrollTo(0,0);
      var tb=findTab(id); var body=document.getElementById('topicBody');
      if(!tb){body.innerHTML='';return;}
      if(!tb.locked){ body.innerHTML=renderContent(tb.content, tb.links); return; }
      // unlocked already?
      var code; try{code=localStorage.getItem('unlock_'+id);}catch(e){}
      if(code && tb._content){ body.innerHTML=renderContent(tb._content, tb._links||[]); return; }
      renderCheckout(tb);
      if(code) tryUnlock(id,code,true);
    }

    function renderContent(content, links){
      var out=pick(content)||'';
      if(links && links.length){
        out+='<div class="links-box"><h4>🔗 '+t('official')+'</h4>';
        links.forEach(function(l){ out+='<a class="link-row" target="_blank" rel="noopener" href="'+esc(l.url)+'"><span>🌐</span><span>'+esc(l.label)+'</span><span class="ext">↗</span></a>'; });
        if(DATA.settings.verifyNote) out+='<div class="verify-note">'+esc(DATA.settings.verifyNote)+'</div>';
        out+='</div>';
      }
      return out;
    }

    function renderCheckout(tb){
      var s=DATA.settings||{}; var cur=s.currency||'€';
      var body=document.getElementById('topicBody');
      body.innerHTML=
        '<div class="locked-head"><div class="big">🔒</div><h3>'+esc(pick(tb.title))+' · '+t('locked')+'</h3>'+
        '<p class="muted">'+esc(pick(tb.teaser)||'')+'…</p><div class="price-tag">'+tb.price+' '+esc(cur)+'</div></div>'+
        '<div class="pay-methods" id="pm">'+
          '<button data-m="paypal" class="active"><span class="pm-ic">🅿️</span>'+t('payPaypal')+'</button>'+
          '<button data-m="usdt"><span class="pm-ic">₮</span>'+t('payUsdt')+'</button>'+
        '</div>'+
        '<div id="methodPane" class="method-pane"></div>'+
        '<div style="margin-top:16px"><b>'+t('afterPay')+'</b></div>'+
        '<div class="row"><div><label class="field">'+t('country')+'</label><select id="o_country">'+COUNTRIES.map(function(c){return '<option>'+esc(c)+'</option>';}).join('')+'</select></div>'+
          '<div><label class="field">'+t('contact')+'</label><input id="o_contact" placeholder="email / +39…"></div></div>'+
        '<label class="field">'+t('proof')+'</label><input id="o_proof" placeholder="TxID / PayPal ref">'+
        '<div style="margin-top:12px"><button class="btn btn-primary btn-block" onclick="submitOrder()">📨 '+t('send')+'</button></div>'+
        '<div style="margin-top:18px;border-top:1px dashed var(--border);padding-top:12px">'+
          '<b>'+t('haveCode')+'</b><div class="unlock-row"><input id="u_code" placeholder="'+t('enterCode')+'" maxlength="12"><button class="btn btn-ghost" onclick="tryUnlock(\''+tb.id+'\',document.getElementById(\'u_code\').value)">🔓 '+t('unlock')+'</button></div>'+
        '</div>';
      PAYMETHOD='paypal';
      [].forEach.call(document.querySelectorAll('#pm button'),function(b){b.addEventListener('click',function(){
        PAYMETHOD=b.getAttribute('data-m');
        [].forEach.call(document.querySelectorAll('#pm button'),function(x){x.classList.toggle('active',x===b);});
        renderMethodPane(tb);
      });});
      renderMethodPane(tb);
    }

    function renderMethodPane(tb){
      var s=DATA.settings||{}; var cur=s.currency||'€'; var pane=document.getElementById('methodPane');
      if(PAYMETHOD==='paypal'){
        if(s.paypalUrl){
          pane.innerHTML='<p>'+t('amount')+': <b>'+tb.price+' '+esc(cur)+'</b></p>'+
            '<a class="btn btn-accent btn-block" target="_blank" rel="noopener" href="'+esc(s.paypalUrl)+'">🅿️ '+t('payPaypalBtn')+'</a>'+
            '<div class="qr-wrap" id="ppqr"></div><p class="muted" style="text-align:center">'+t('scanPay')+'</p>';
          var pq=document.getElementById('ppqr'); if(pq){pq.innerHTML='';try{new QRCode(pq,{text:s.paypalUrl,width:150,height:150});}catch(e){pq.innerHTML='';}}
        } else { pane.innerHTML='<p class="muted">PayPal غير مُفعّل بعد (أضف الرابط من لوحة التحكم).</p>'; }
      } else {
        var addr=s.usdtAddress||''; var net=s.usdtNetwork||'TRC20';
        pane.innerHTML='<p>'+t('amount')+': <b>'+tb.price+' USDT</b> · '+t('network')+': <span class="net-pill">'+esc(net)+'</span></p>'+
          (addr?('<p class="muted">'+t('openBybit')+'</p><div class="addr"><span id="usdtAddr">'+esc(addr)+'</span><button class="btn btn-ghost btn-sm" onclick="copyAddr()">📋 '+t('copy')+'</button></div><div class="qr-wrap" id="qr"></div>'):'<p class="muted">عنوان USDT غير مضبوط بعد (أضفه من لوحة التحكم).</p>')+
          (s.usdtNote?('<div class="steps">ℹ️ '+esc(s.usdtNote)+'</div>'):'');
        if(addr){ var q=document.getElementById('qr'); q.innerHTML=''; try{ new QRCode(q,{text:addr,width:160,height:160}); }catch(e){ q.innerHTML='<div class="muted">QR…</div>'; } }
      }
    }

    function copyAddr(){ var a=document.getElementById('usdtAddr'); if(!a)return; var txt=a.textContent;
      if(navigator.clipboard){navigator.clipboard.writeText(txt).then(function(){toast(t('copied'));});}
      else{var r=document.createRange();r.selectNode(a);window.getSelection().removeAllRanges();window.getSelection().addRange(r);document.execCommand('copy');toast(t('copied'));}
    }

    function submitOrder(){
      var tb=findTab(CURRENT); if(!tb)return;
      var contact=document.getElementById('o_contact').value.trim();
      var proof=document.getElementById('o_proof').value.trim();
      if(!contact||!proof){toast(t('fill'),true);return;}
      var payload={tabId:tb.id,method:PAYMETHOD,proof:proof,contact:contact,country:document.getElementById('o_country').value};
      google.script.run.withSuccessHandler(function(r){
        if(r&&r.ok){ document.getElementById('topicBody').innerHTML='<div class="locked-head"><div class="big">✅</div><h3>'+t('sent')+'</h3><p class="muted">#'+r.orderId+'</p></div>'; }
      }).withFailureHandler(function(e){toast(e.message,true);}).createOrder(payload);
    }

    function tryUnlock(id,code,silent){
      code=(code||'').trim().toUpperCase(); if(!code)return;
      google.script.run.withSuccessHandler(function(res){
        if(res&&res.ok){ var tb=findTab(id); tb._content=res.content; tb._links=res.links||[];
          try{localStorage.setItem('unlock_'+id,code);}catch(e){}
          document.getElementById('topicBody').innerHTML=renderContent(res.content,res.links||[]);
          if(!silent) toast(t('unlocked'));
        } else if(!silent){ toast(t('badCode'),true); }
      }).getLockedContent(id,code);
    }

    function goHome(){ renderBanners(); }

    // darken/lighten hex color
    function shade(hex,p){ try{ var n=parseInt(hex.slice(1),16),r=(n>>16)+p*2.55,g=((n>>8)&255)+p*2.55,b=(n&255)+p*2.55;
      r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
      return '#'+((1<<24)+(Math.round(r)<<16)+(Math.round(g)<<8)+Math.round(b)).toString(16).slice(1);}catch(e){return hex;} }

    window.addEventListener('load',init);
  </script>
</body>
</html>
