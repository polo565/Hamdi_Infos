name: Déployer vers Google Apps Script

# Se déclenche à chaque push sur la branche principale.
on:
  push:
    branches: [ main ]
  workflow_dispatch:   # permet aussi un lancement manuel depuis l'onglet Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer clasp
        run: npm install -g @google/clasp@2.4.2

      - name: Écrire les identifiants clasp
        run: |
          echo "$CLASPRC_JSON" > "$HOME/.clasprc.json"
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}

      - name: Pousser vers Apps Script
        run: clasp push --force
